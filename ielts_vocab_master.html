function parseStructuredReview(reply){
  const raw=String(reply||'').trim();
  const taggedMatch=raw.match(/##\s*MEMORY\s*##\s*([\s\S]*?)\s*##\s*END\s*MEMORY\s*##/i);
  const candidates=[];
  if(taggedMatch)candidates.push(taggedMatch[1]);
  candidates.push(raw);
  const fenced=[...raw.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)].map(m=>m[1]);
  candidates.push(...fenced);

  const extractJsonObject=text=>{
    const source=String(text||'');
    for(let start=source.indexOf('{');start>=0;start=source.indexOf('{',start+1)){
      let depth=0,inString=false,escaped=false;
      for(let i=start;i<source.length;i++){
        const ch=source[i];
        if(inString){
          if(escaped)escaped=false;
          else if(ch==='\\')escaped=true;
          else if(ch==='"')inString=false;
          continue;
        }
        if(ch==='"'){inString=true;continue}
        if(ch==='{')depth++;
        if(ch==='}'&&--depth===0)return source.slice(start,i+1);
      }
    }
    return'';
  };

  let analysis=null;
  for(const candidate of candidates){
    const jsonText=extractJsonObject(candidate);
    if(!jsonText)continue;
    try{
      const parsed=JSON.parse(jsonText);
      const obj=parsed.analysis&&typeof parsed.analysis==='object'?parsed.analysis:parsed;
      if(obj&&typeof obj==='object'&&('hasError'in obj||'score'in obj)){
        analysis={...obj};
        if(typeof analysis.hasError==='string')analysis.hasError=/^true$/i.test(analysis.hasError);
        else analysis.hasError=Boolean(analysis.hasError);
        const score=Number(analysis.score);
        analysis.score=Number.isFinite(score)?score:NaN;
        analysis.errorExcerpt=String(analysis.errorExcerpt||'');
        analysis.correctedSentence=String(analysis.correctedSentence||'');
        break;
      }
    }catch{}
  }

  let cleanText=taggedMatch?raw.replace(taggedMatch[0],'').trim():raw;
  cleanText=cleanText.replace(/```(?:json)?\s*\{[\s\S]*?\}\s*```/gi,'').trim();
  cleanText = cleanText.replace(/(?:\*\*|)?Step 3:\s*Machine-readable block(?:\s*\(REQUIRED\):|)?(?:\*\*|)?/gi, '').trim();
  if(analysis&&/^\s*\{[\s\S]*\}\s*$/.test(cleanText))cleanText='';
  if(analysis&&!cleanText){
    cleanText=analysis.hasError
      ? (analysis.feedback||'Your sentence needs one correction.')
      : '✅ No errors found — your sentence is correct and natural.';
  }
  return{cleanText:cleanText||raw,analysis};
}

function validateStructuredReview(result, targetWord, studentSentence){
  const analysis=result?.analysis;
  if(!analysis)return 'The response did not contain an analysis object.';
  if(typeof analysis.score!=='number'||!Number.isFinite(analysis.score)||analysis.score<0||analysis.score>9)return 'score must be a number from 0 to 9.';
  const score=Number(analysis.score);
  const excerpt=String(analysis.errorExcerpt||'').trim();
  const corrected=String(analysis.correctedSentence||'').trim();
  const student=String(studentSentence||'').trim();
  if(analysis.hasError){
    if(score>=7)return 'A real error must receive a score below 7.';
    if(analysis.isNatural===true)return 'A sentence with an objective error cannot be marked natural.';
    if(!String(analysis.feedback||'').trim())return 'feedback must explain the objective error and the correction.';
    if(!excerpt||!student.toLowerCase().includes(excerpt.toLowerCase()))return 'errorExcerpt must be an exact substring of the student sentence.';
    if(!corrected||normalizeReviewedSentence(corrected)===normalizeReviewedSentence(student))return 'correctedSentence must actually correct the sentence.';
    if(targetWord&&!hasPhraseFlexible(corrected,targetWord))return 'correctedSentence must keep the target word or a valid grammatical form.';
  }else{
    if(score<7)return 'A sentence with no objective error must score at least 7.';
    if(analysis.isNatural===false)return 'A sentence with no objective error must be marked natural.';
    if(excerpt)return 'errorExcerpt must be empty when hasError is false.';
  }
  return '';
}

function renderStructuredReview(result,studentSentence){
  const analysis=result?.analysis||{};
  const feedback=String(analysis.feedback||'').trim();
  if(analysis.hasError){
    return `❌ ${feedback||'One objective issue needs correction.'}\n\nNatural Band 7 version:\n${analysis.correctedSentence}`;
  }
  return `✅ ${feedback||'No objective errors found — your sentence is correct and natural.'}`;
}

async function fetchStructuredReview(messages,invalidMessage,validator){
  const hdrs={'Content-Type':'application/json'};
  const rubric={role:'system',content:'Score a single practice sentence, not an official IELTS band. Use the same 0–9 rubric each time: 0–2 unintelligible/off-task, 3–4 major meaning or grammar failures, 5–6 objective errors but understandable, 7 correct and clear, 8 natural and precise, 9 fully accurate and especially effective in this context. Do not reward unnecessary complexity. Accept valid British/American variants. Quote exact evidence for any error. Distinguish optional style improvements from actual errors.'};
  messages=[rubric,...messages];
  let attemptMessages=[...messages];
  for(let attempt=0;attempt<2;attempt++){
    const body=JSON.stringify({task:"review",retry:attempt>0,model:MODEL,messages:attemptMessages,temperature:attempt===0?.05:0,top_p:1,max_tokens:1000,stream:false});
    const res=await fetchAI(body,hdrs);
    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content||'';
    const parsed=parseStructuredReview(reply);
    const validationError=parsed.analysis&&validator?validator(parsed):'';
    if(parsed.analysis&&!validationError){
      parsed.reply=renderStructuredReview(parsed);
      return parsed;
    }
    attemptMessages=[
      ...messages,
      {role:'assistant',content:reply||'(empty response)'},
      {role:'user',content:`Your previous response was invalid: ${validationError||'Your previous response was missing valid machine-readable JSON.'} Return the complete review again. Include exactly one valid JSON object between ##MEMORY## and ##ENDMEMORY##. Do not omit any required field.`}
    ];
  }
  throw new Error(invalidMessage);
}

function checkGeneralGrammarErrors(userText) {
  const text = String(userText || '').trim();

  // 1. Article "a" before vowel sound ("a investor", "a apple", "a option", "a engineer", "a author", "a item", "a issue")
  const aVowelMatch = text.match(/\ba\s+(?!(?:unit|univ|europ|one|uniform|unique|useful|usual|ubiquitous|user)\b)([aeiou]|hon|hour)\w*\b/i);
  if (aVowelMatch) {
    const wrongWord = aVowelMatch[0];
    const rightWord = 'an ' + wrongWord.slice(2);
    return {
      hasError: true,
      score: 5,
      errorExcerpt: wrongWord,
      feedback: `Article error in "${wrongWord}": use "an" before vowel sounds (e.g., "${rightWord}" instead of "${wrongWord}").`,
      suggestedCorrection: text.replace(wrongWord, rightWord)
    };
  }

  // 2. Singular antecedent noun + who/that/which + base verb ("investor who want", "person who go", "man who have")
  const relSubjVerbMatch = text.match(/\b(investor|person|man|woman|student|teacher|client|customer|applicant|candidate|buyer|seller|owner|worker|employee|someone|anyone|everyone)\s+(?:who|that|which)\s+(want|go|have|leave|make|take|see|come|give|know|think|find|tell|become|show|feel|put|bring|keep|hold|write|stand|hear|let|mean|set|meet|run|pay|sit|speak|lead|read|grow|lose|fall|send|build|understand|draw|break|spend|cut|rise|drive|buy|wear|choose)\b/i);
  if (relSubjVerbMatch) {
    const noun = relSubjVerbMatch[1];
    const verb = relSubjVerbMatch[2];
    const wrongPhrase = relSubjVerbMatch[0];
    const rightPhrase = `${noun} who ${verb}s`;
    return {
      hasError: true,
      score: 5,
      errorExcerpt: wrongPhrase,
      feedback: `Subject-verb agreement error in "${wrongPhrase}": singular antecedent "${noun}" requires conjugated verb (e.g., "${rightPhrase}").`,
      suggestedCorrection: text.replace(wrongPhrase, rightPhrase)
    };
  }

  // 3. Missing preposition in idiom usage ("offer my company", "put in an offer my company")
  const offerMissingPrepMatch = text.match(/\b(put\s+in\s+an?\s+offer|make\s+an?\s+offer|submit\s+an?\s+offer)\s+(?:my|our|the|a|this|that)\b/i);
  if (offerMissingPrepMatch) {
    const wrongPhrase = offerMissingPrepMatch[0];
    const rightPhrase = wrongPhrase.replace(/(offer)\s+/, '$1 for ');
    return {
      hasError: true,
      score: 5,
      errorExcerpt: wrongPhrase,
      feedback: `Missing preposition in "${wrongPhrase}": use "for" or "on" (e.g., "${rightPhrase}").`,
      suggestedCorrection: text.replace(wrongPhrase, rightPhrase)
    };
  }

  // 4. Missing article in prepositional price phrases ("with suitable price", "at reasonable price")
  const priceArticleMatch = text.match(/\b(with|at|for)\s+(suitable|reasonable|good|fair|affordable|high|low)\s+price\b/i);
  if (priceArticleMatch) {
    const wrongPhrase = priceArticleMatch[0];
    const prep = priceArticleMatch[1].toLowerCase() === 'with' ? 'at' : priceArticleMatch[1];
    const adj = priceArticleMatch[2];
    const rightPhrase = `${prep} a ${adj} price`;
    return {
      hasError: true,
      score: 6,
      errorExcerpt: wrongPhrase,
      feedback: `Missing article in "${wrongPhrase}": use "a" (e.g., "${rightPhrase}" instead of "${wrongPhrase}").`,
      suggestedCorrection: text.replace(wrongPhrase, rightPhrase)
    };
  }

  // 5. Missing main verb after modal verb (e.g. "will on", "can under", "would in")
  const missingVerbMatch = text.match(/\b(will|would|can|could|should|must|may|might)\s+(?:on|in|at|to|for|with|by|from|about|through|under|over|between|among|as|into|onto|off|out)\b/i);
  if (missingVerbMatch) {
    const modal = missingVerbMatch[1];
    const prep = missingVerbMatch[0].split(/\s+/)[1];
    return {
      hasError: true,
      score: 5,
      errorExcerpt: missingVerbMatch[0],
      feedback: `Missing main verb after "${modal}" (e.g., "${modal} be ${prep}" instead of "${missingVerbMatch[0]}").`,
      suggestedCorrection: text.replace(missingVerbMatch[0], `${modal} be ${prep}`)
    };
  }

  // 6. Base form verb after 3rd person singular pronoun ("she slide", "he go", "she leave", "he have")
  const thirdPersonBase = text.match(/\b(he|she|it)\s+(slide|go|leave|make|take|see|come|give|know|think|find|tell|become|show|feel|put|bring|keep|hold|write|stand|hear|let|mean|set|meet|run|pay|sit|speak|lie|lead|read|grow|lose|fall|send|build|understand|draw|break|spend|cut|rise|drive|buy|wear|choose)\b/i);
  if (thirdPersonBase) {
    const sub = thirdPersonBase[1];
    const v = thirdPersonBase[2];
    return {
      hasError: true,
      score: 5,
      errorExcerpt: thirdPersonBase[0],
      feedback: `Grammar error in "${thirdPersonBase[0]}": 3rd person singular subject "${sub}" requires correct verb form (e.g., "${sub} ${v}s" or past tense).`,
      suggestedCorrection: text.replace(thirdPersonBase[0], `${sub} ${v}s`)
    };
  }

  // 7. Double / Redundant Prepositions ("slide past through", "pass by through")
  const doublePrep = text.match(/\b(past|by|through|across|along|around|over|under|into|onto|off)\s+(through|into|onto|across|along|around|over|under|past|by)\b/i);
  if (doublePrep) {
    return {
      hasError: true,
      score: 6,
      errorExcerpt: doublePrep[0],
      feedback: `Redundant prepositions in "${doublePrep[0]}". Use only one preposition (e.g., "${doublePrep[1]} a street").`,
      suggestedCorrection: text.replace(doublePrep[0], doublePrep[1])
    };
  }

  // 8. Missing possessive 's for family/person relationship ("father life", "mother car")
  const missingPossessive = text.match(/\b(father|mother|brother|sister|parent|doctor|teacher|friend|president|king|queen|child|baby|man|woman|people|person|husband|wife|son|daughter)\s+(life|car|house|book|job|work|name|story|home|family|health|future|opinion)\b/i);
  if (missingPossessive) {
    return {
      hasError: true,
      score: 6,
      errorExcerpt: missingPossessive[0],
      feedback: `Missing possessive "'s" in "${missingPossessive[0]}" (should be "${missingPossessive[1]}'s ${missingPossessive[2]}").`,
      suggestedCorrection: text.replace(missingPossessive[0], `${missingPossessive[1]}'s ${missingPossessive[2]}`)
    };
  }

  return null;
}

function normalizeTranslationReviewResult(result,userTranslation,targetWord=''){
  const error=validateStructuredReview(result,targetWord,userTranslation);
  if(error)throw new Error(`Review could not be validated: ${error}`);
  result.analysis.score=Math.round(result.analysis.score*2)/2;
  return result;
}

async function fetchAIRateLimited(url, headers, originalBody) {
  let requestBody=JSON.parse(originalBody);
  for(let attempt=0;attempt<16;attempt++){
    const response=await fetch(url,{method:'POST',headers,body:JSON.stringify(requestBody)});
    if(response.status!==429)return response;
    if(attempt===15)return response;
    const wait=Math.max(1,Math.min(120,Number(response.headers.get('Retry-After'))||15));
    if(importBusy){const preview=$('#importPreview');if(preview)preview.textContent=`AI limit: 4 requests/minute. Continuing import in ${wait} seconds…`;}
    const resume=Number(response.headers.get('X-AI-Resume-Model'));
    if(Number.isInteger(resume)&&resume>=0)requestBody.resumeModel=resume;
    const routing=typeof response.clone==='function'?await response.clone().json().catch(()=>null):null;
    if(Array.isArray(routing?.routingFailures))requestBody.routingFailures=routing.routingFailures;
    await new Promise(resolve=>setTimeout(resolve,wait*1000));
  }
}

// Robust AI fetch: local Vercel serverless proxy (/api/chat) → production proxy
async function aiResponseError(response){
  const text=await response.text().catch(()=>'');let details;
  try{details=JSON.parse(text);}catch{}
  const error=new Error(`API error ${response.status} — ${details?.error||text.slice(0,160)||'AI service unavailable'}`);
  error.code=details?.code;error.routingFailures=details?.routingFailures;
  return error;
}
async function fetchAI(body, hdrs) {
  let lastErr;

  // 1. Try Vercel /api/chat serverless proxy (no CORS, works in prod + vercel dev)
  try {
    const r = await fetchAIRateLimited('/api/chat',hdrs,body);
    // 404/405 means we're on a plain static server (python3 http.server) — skip gracefully
    if (r.status !== 404 && r.status !== 405) {
      if (r.ok) return r;
      throw await aiResponseError(r);
    }
  } catch(e) {
    if (e.message && e.message.startsWith('API error')) throw e;
    lastErr = e;
  }

  // 2. If opened from file:// or a plain static server, use the production proxy.
  try {
    const r = await fetchAIRateLimited(API_PROXY_URL,hdrs,body);
    if (r.ok) return r;
    throw await aiResponseError(r);
  } catch(e) {
    if (e.message && e.message.startsWith('API error')) throw e;
    lastErr = e;
  }

  throw lastErr || new Error('Connection failed. Check your internet connection.');
}

async function requestSentenceSuggestion(word) {
  const prompt = `You are an IELTS writing coach. Give the student one simple, basic sentence structure option (e.g., Band 5.0-6.0 level) and one short, easy writing idea to help them write a sentence using the target word/phrase: "${word}".
Keep it extremely concise (1 line for idea, 1 line for basic structure, in total under 45 words).
Format exactly like this (use bolding for labels):
**Idea:** [Describe a short, simple writing idea using the word]
**Structure:** [Provide a simple, clear sentence structure template that is easy to write, replacing the word placement with the word or a placeholder]`;
  const msgs = [
    { role: 'system', content: '/no_think\nYou are an encouraging IELTS coach. Give short suggestions.' },
    { role: 'user', content: prompt }
  ];
  const body = JSON.stringify({ model: MODEL, messages: msgs, temperature: 0.3, max_tokens: 900, stream: false });
  const hdrs = { 'Content-Type': 'application/json' };
  const res = await fetchAI(body, hdrs);
  const data = await res.json();
  return data.choices?.[0]?.message?.content || 'Could not fetch suggestion.';
}

async function requestStructuredSentenceReview(word, sentence) {
  const prompt = `You are a supportive, friendly IELTS writing coach. Review exactly one student sentence that uses the target word/phrase: "${word}".

Target word: "${word}"
Student's sentence: "${sentence}"

## Your Grading Checklist:
1. **Grammar & Spelling**: Check for clear, objective grammar errors.
2. **Vocabulary usage**: Is "${word}" used correctly and naturally?
3. **Naturalness**: Does the sentence sound like natural, modern English?

## Guidelines for Corrections & Suggestions:
- **Tone**: Keep your feedback friendly, supportive, and easy to understand.
- **Realistic Band 7 level**: Do NOT use overly obscure, high-level vocabulary, or overly academic/formal phrases (e.g., avoid excessively formal words like "borne witness" or "pivotal" unless perfectly natural in context). The language should be clear, realistic, and easy to replicate for an IELTS Band 7.0-7.5 candidate.
- **No Over-Explaining**: Avoid complicated linguistic jargon. Keep explanations simple, short, and practical.
- **Target forms**: Dictionary placeholders such as "someone", "somebody", or "one's" may naturally become a noun, "him", "her", "them", or a possessive determiner. Accept grammatical inflections and passive forms such as "brought them to justice".
- **Scoring rubric**: 8.0-9.0 = correct, natural, and precise; 7.0-7.5 = grammatically correct with at most optional style improvements; 5.0-6.0 = one or more real grammar, meaning, or target-usage errors. Never award 7+ when a real ❌ remains.

## CRITICAL — Anti-False-Positive Rules:
- **JSON is authoritative**: The hasError, score, errorExcerpt, and correctedSentence fields must agree with one another. Do not describe a sentence as correct in prose while setting hasError to true, or vice versa.
- **Correction must preserve the target**: correctedSentence must contain "${word}" or a valid grammatical form of it. Never replace or omit the target word just to make the sentence smoother.
- **Self-check the correction**: Before returning JSON, silently proofread correctedSentence for grammar, meaning, collocation, and naturalness. It must be a complete sentence that another IELTS tutor could accept as Band 7.
- **"it" as situation pronoun**: The pronoun "it" can refer to a situation, decision, or general context — NOT just a specific noun. For example, "We have options, but it depends on the budget" is CORRECT because "it" means the situation or decision. Do NOT change "it" to "they" unless "it" clearly and unambiguously refers to a plural noun.
- **Benefit of the doubt**: If you are unsure whether something is a grammar error, it is NOT an error. Only mark ❌ for errors you are 100% confident about. When in doubt, mark ⚠️ or skip it entirely.
- **Do NOT restructure the student's sentence**: Only correct actual grammar mistakes. Do not rewrite the sentence into a completely different structure just because you prefer different phrasing.
- **Multiple valid sentences exist**: Accept any grammatically correct, natural sentence that uses the target word or phrase correctly, even if it differs from the sentence you would write.
- **Style is not an error**: A more formal, passive, concise, or idiomatic alternative is only ⚠️. Do not lower a correct sentence below 7 for style.
- **Ground every error**: When hasError is true, errorExcerpt MUST be a non-empty exact substring copied from the student's sentence. If you cannot quote the error exactly, set hasError to false.
- **No contradictory correction**: The improved version must fix every ❌ and must itself be fully correct. Prefer the smallest natural correction.
- **Natural legal English**: "bring someone to justice" is natural in active or passive form. Do not recommend "guarantee to bring them to justice" when "bring them to justice" or "make sure they are brought to justice" expresses the meaning more naturally.

## Response Format:

**Step 1: List each issue found** (use ❌ for grammar/vocabulary errors, ⚠️ for naturalness/stylistic suggestions):
For each issue, write:
❌ "problematic phrase" → "corrected phrase" — short simple explanation
or ⚠️ "phrase" → "better phrase" — short simple explanation

If no issues at all, write: ✅ No errors found — great job!

**Step 2: Natural & Improved Version**
If there is a ❌, provide one minimally corrected Band 7.0-7.5 version. If there is no ❌, preserve the student's sentence as the improved version; you may mention one optional alternative separately. Keep all language simple and realistic.

**Step 3: Machine-readable block** (REQUIRED):
Return only the machine-readable block below. Do not add a second conflicting assessment outside it.
##MEMORY##
{"hasError":true_or_false,"score":0_to_9,"isNatural":true_or_false,"errorType":"grammar|collocation|word_usage|vocabulary_choice|structure|other","severity":"minor|major","errorExcerpt":"exact erroneous words copied verbatim from the student's translation; empty only when hasError is false","corePattern":"general_writing_check","shortReminder":"Review writing","feedback":"Short feedback","correctedSentence":"improved sentence","nextPracticePrompt":""}
##ENDMEMORY##`;
  const compactPrompt=`Grade one IELTS Band 7 practice sentence.
Target expression: "${word}"
Student sentence: "${sentence}"

Rules:
- Mark an error only for objective grammar, spelling, collocation, meaning, or incorrect target usage. Optional style changes are not errors.
- Accept natural grammatical inflections, pronouns replacing placeholders such as someone/one's, and passive forms.
- "It depends" may correctly refer to a situation. If unsure, give the student the benefit of the doubt.
- Check coordination generally: coordinated elements must have compatible grammatical forms (for example, noun+noun or verb+verb), but do not force one preferred wording when both structures are grammatical.
- Check the full set of common IELTS issues: subject-verb agreement, tense, articles, countability, prepositions, word forms, collocation, sentence boundaries, meaning, and register. Only report an issue when the evidence is clear in this sentence.
- For coordination, keep grammar parallel: after "for" use noun + noun ("for simulation and analysis"), while after "to" use verb + verb ("to simulate and analyse"). "Analyse" is correct British English and "analyze" is correct American English; do not give a data-related explanation unless the sentence actually mentions data.
- When translating "hiện tượng thời tiết", prefer "weather phenomena"; do not silently replace it with "weather trends" unless the source means trends.
- If hasError is false: score must be 7-9, errorExcerpt must be empty, isNatural must be true, and correctedSentence must preserve the student's sentence.
- If hasError is true: score must be below 7, errorExcerpt must be an exact substring of the student sentence, and correctedSentence must be a minimally changed, fully natural Band 7 sentence.
- A corrected sentence must keep "${word}" or a valid grammatical form. Silently proofread it before answering.
- Feedback must explain the exact change made in correctedSentence using the relevant grammatical or usage principle; never mention a different correction or an example word that is absent from the sentence.

Return only this block with one valid JSON object and no other text:
##MEMORY##
{"hasError":false,"score":7,"isNatural":true,"errorType":"grammar|collocation|word_usage|vocabulary_choice|structure|other","severity":"minor|major","errorExcerpt":"","corePattern":"short rule","shortReminder":"short reminder","feedback":"one concise helpful sentence","correctedSentence":"complete sentence","nextPracticePrompt":""}
##ENDMEMORY##`;
  const msgs=[{role:'system',content:'/no_think\nBe a precise IELTS sentence grader. Follow the JSON contract exactly.'},{role:'user',content:compactPrompt}];
  return fetchStructuredReview(
    msgs,
    'The AI returned an invalid writing review after two attempts. Please check again.',
    result=>validateStructuredReview(result,word,sentence)
  );
}

function parseVietnamesePromptResponse(raw, word) {
  try {
    const cleaned=String(raw||'').replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/i,'').trim();
    const match=cleaned.match(/\{[\s\S]*\}/);
    if(!match)return null;
    const obj=JSON.parse(match[0]);
    const vi=String(obj.vi||'').replace(/[\u4e00-\u9fa5]/g,'').replace(/\s+/g,' ').trim();
    const hint=String(obj.hint||'').replace(/[\u4e00-\u9fa5]/g,'').trim();
    const containsTarget=vi.toLowerCase().includes(String(word||'').toLowerCase());
    const hasVietnamese=/[ăâđêôơưà-ỹ]/i.test(vi);
    const wordCount=vi.split(/\s+/).filter(Boolean).length;
    const suspiciousVietnamese=/\bcú đâm thanh\b|\blàm ra (?:cái )?chết\b/i.test(vi);
    const wrongJusticeMeaning=norm(word)==='bring someone to justice'&&/đưa[^.]{0,60}ra ánh sáng/i.test(vi);
    if(!vi||containsTarget||!hasVietnamese||wordCount<6||wordCount>35||suspiciousVietnamese||wrongJusticeMeaning)return null;
    return{vi,hint};
  }catch{
    return null;
  }
}

async function requestViTranslationPrompt(word, vietnameseMeaning='') {
  const history = generatedPromptsHistory[word] || [];
  const avoidText = history.length ? `Previously generated sentences (do NOT repeat or use similar ones): ${JSON.stringify(history)}` : '';
  const prompt = `You are a native Vietnamese IELTS tutor. Generate ONE polished Vietnamese sentence for the student to translate into English.
The Vietnamese sentence MUST represent a context where the target English word/phrase: "${word}" would be used naturally and correctly in the English translation.
Reference Vietnamese meaning: "${vietnameseMeaning || 'infer the standard meaning accurately'}"

CRITICAL RULES:
1. Do NOT put the English target "${word}" in the Vietnamese sentence. Express its meaning in natural Vietnamese.
2. Write correct, fluent, everyday Vietnamese with proper diacritics. Check spelling and word choice before answering.
3. Create one complete, unambiguous sentence of 10-25 words. Avoid fragments, vague references, and unclear singular/plural information when that distinction matters.
4. The expected English answer must be natural at IELTS Band 6.5-7.5: clear and useful, never obscure, literary, or excessively formal.
5. Do not create unnatural Vietnamese such as "làm ra cái chết". Use forms such as "gây ra cái chết" or "chịu trách nhiệm về cái chết" when appropriate.
6. For legal expressions, use accurate Vietnamese: "bring someone to justice" means "đưa ai đó ra trước công lý / bắt và đưa ra xét xử", not "đưa ai đó ra ánh sáng".
7. The hint must describe context only. Do not reveal a full English translation.
8. Use Vietnamese Latin script only. Never include Chinese characters, Kanji, Hanja, Markdown, or commentary.
${avoidText}
Return exactly one JSON object:
{"vi": "Natural Vietnamese sentence", "hint": "Brief hint about the context, tone, or key word in English"}`;

  const msgs = [
    { role: 'system', content: '/no_think\nYou generate proofread, native Vietnamese translation exercises. Return valid JSON only.' },
    { role: 'user', content: prompt }
  ];
  const hdrs = { 'Content-Type': 'application/json' };
  for(let attempt=0;attempt<2;attempt++){
    const body=JSON.stringify({model:MODEL,messages:msgs,temperature:0.35,max_tokens:400,stream:false});
    const res=await fetchAI(body,hdrs);
    const data=await res.json();
    const parsed=parseVietnamesePromptResponse(data.choices?.[0]?.message?.content||'',word);
    if(parsed){
      if(!generatedPromptsHistory[word])generatedPromptsHistory[word]=[];
      generatedPromptsHistory[word].push(parsed.vi);
      generatedPromptsHistory[word]=generatedPromptsHistory[word].slice(-8);
      return parsed;
    }
    msgs.push({role:'assistant',content:String(data.choices?.[0]?.message?.content||'')});
    msgs.push({role:'user',content:'That output failed validation. Proofread it and return one new valid JSON object only.'});
  }
  throw new Error('The generated Vietnamese prompt was invalid after two attempts.');
}

async function requestTranslationReview(word, viPrompt, userTranslation) {
  const prompt = `You are a rigorous, supportive IELTS writing coach and English linguist. Grade the student's English translation of a Vietnamese sentence.

Target word/phrase: "${word}"
CURRENT Vietnamese sentence prompt to translate: "${viPrompt}"
Student's English translation of the CURRENT sentence: "${userTranslation}"

## FLEXIBLE & COMPREHENSIVE EVALUATION CHECKLIST:
1. **Grammar, Articles & Agreement**:
   - Check articles strictly: "a investor" is an ❌ article error (must be "an investor"). never claim an article is missing when it appears in the student's exact translation.
   - Check subject-verb agreement: "investor who want" is an ❌ error (must be "investor who wants"). "she slide" is an ❌ error (must be "she slid" or "she slides").
   - Check relative clauses ("who/that/which" agreement) and tenses across all clauses.
2. **Prepositions, Idioms & Syntax**:
   - Check phrasal verbs & idiom structures: "put in an offer my company" is an ❌ error missing a preposition (must be "put in an offer FOR/ON our company").
   - Check for redundant/double prepositions: "slide past through" is an ❌ error.
   - Check price & cost phrases: "with suitable price" is an ❌ error (must be "at a suitable price").
3. **Sentence Structure & Verbs**:
   - Check for missing main verbs: "will on the market" is an ❌ error (must be "will be on the market").
   - Check possessive forms: "father life" is an ❌ error (must be "father's life").
   - Check predicate adjective forms: "has already been public" is an ❌ error (must be "has already been published" or "been made public").
4. **Scoring & Discipline**:
   - If the translation contains ANY grammar, article, preposition, tense, agreement, missing verb, or word form error, you MUST set "hasError": true and "score": 4, 5, or 6.
   - Scores 7, 8, and 9 are reserved STRICTLY for translations that are 100% grammatically correct, complete, and natural.
   - Provide a complete "correctedSentence" that fixes ALL errors in the student's translation.
   - In "feedback", write a clear detailed explanation listing every issue found and explaining how to fix each one.

## CRITICAL — Anti-False-Positive Rules:
- **JSON is authoritative**: The hasError, score, errorExcerpt, and correctedSentence fields must agree with one another.
- **Correction must preserve the target**: correctedSentence must contain "${word}" or a valid grammatical form of it.
- **Self-check the correction**: Before returning JSON, proofread correctedSentence for grammar, meaning, collocation, and naturalness.
- **"it" as situation pronoun**: The pronoun "it" can refer to a situation, decision, or general context — NOT just a specific noun.
- **Benefit of the doubt**: If you are unsure whether an optional stylistic variation is a grammar error, mark it as style.
- **Multiple valid translations exist**: Accept any grammatically correct translation that captures the meaning.

## Response Format:

**Step 1: List each issue found** (use ❌ for grammar/vocabulary errors, ⚠️ for naturalness/stylistic suggestions):
For each issue, write:
❌ "problematic phrase" → "corrected phrase" — short simple explanation
or ⚠️ "phrase" → "better phrase" — short simple explanation

If no issues at all, write: ✅ No errors found — great job!

**Step 2: Natural & Improved Version**
If there is a ❌, provide one minimally corrected Band 7.0-7.5 version. If there is no ❌, preserve the student's translation as the improved version.

**Step 3: Machine-readable block** (REQUIRED):
Return only the machine-readable block below. Do not add a second conflicting assessment outside it.
##MEMORY##
{"hasError":true_or_false,"score":0_to_9,"isNatural":true_or_false,"errorType":"grammar|collocation|word_usage|vocabulary_choice|structure|other","severity":"minor|major","errorExcerpt":"exact erroneous words copied verbatim from the student's translation; empty only when hasError is false","corePattern":"general_writing_check","shortReminder":"Review writing","feedback":"detailed clear explanation listing all errors found and how to fix them","correctedSentence":"the natural improved sentence","nextPracticePrompt":""}
##ENDMEMORY##`;

  const compactPrompt=`Grade one English translation for IELTS Band 7 practice.
Target expression: "${word}"
Vietnamese source: "${viPrompt}"
Student translation: "${userTranslation}"

Evaluation & Strict Rules:
1. GRAMMAR & LOGIC CHECK:
   - Subject-verb agreement (e.g. "she leave" is a ❌ GRAMMAR ERROR -> must be "she left" or "it left").
   - Semantic logic & pronoun usage: "she leave her speechless" is ❌ WRONG because a person cannot leave herself speechless; the scene/shooting or "it" must be the subject ("it left her speechless").
   - Check tenses, articles, countability, prepositions, and word forms carefully.
   - If there is ANY grammar, logic, tense, or collocation error, you MUST set "hasError": true and "score": 4, 5, or 6.
2. DISCIPLINE & CONSISTENCY:
   - If you suggest ANY change or correction in correctedSentence, you MUST set "hasError": true and "score" below 7.
   - Never set "hasError": false if the student sentence contains a grammar mistake or requires correction.
   - When "hasError" is true, "errorExcerpt" MUST be an exact substring from the student's translation.
   - If hasError is false: score must be 7-9, errorExcerpt must be empty, isNatural must be true, and correctedSentence must match the student's translation.
   - A corrected sentence must keep "${word}" or a valid grammatical form. Silently proofread it before answering.

Return only this block with one valid JSON object and no other text:
##MEMORY##
{"hasError":false,"score":7,"isNatural":true,"errorType":"grammar|collocation|word_usage|vocabulary_choice|structure|other","severity":"minor|major","errorExcerpt":"","corePattern":"short rule","shortReminder":"short reminder","feedback":"detailed clear explanation listing all errors found and how to fix them","correctedSentence":"complete sentence","nextPracticePrompt":""}
##ENDMEMORY##`;

  const msgs = [
    { role: 'system', content: '/no_think\nBe a precise IELTS translation grader. Follow the JSON contract exactly.' },
    { role: 'user', content: compactPrompt }
  ];
  return fetchStructuredReview(
    msgs,
    'The AI returned an invalid translation review after two attempts. Please check again.',
    result=>validateStructuredReview(result,word,userTranslation)
  );
}

async function sendAIMsg(){
  const inp=$('#aiInput');const text=inp.value.trim();
  if(!text||aiLoading)return;
  chatHistory.push({role:'user',content:text});
  
  inp.value='';
  inp.disabled=true;
  inp.placeholder="AI Tutor is typing...";
  $('#aiSend').disabled=true;
  
  renderAIChat();
  // Typing indicator
  const area=$('#aiChat');
  const ti=document.createElement('div');ti.className='ai-msg assistant';ti.id='aiTyping';
  ti.innerHTML=`<div class="ai-msg-avatar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/></svg></div><div class="ai-bubble"><div class="ai-typing"><span></span><span></span><span></span></div></div>`;
  area.appendChild(ti);area.scrollTop=area.scrollHeight;
  aiLoading=true;

  try{
    const msgs=[{role:'system',content:buildSysPrompt()},...chatHistory.map(m=>({role:m.role,content:m.content}))];
    const body=JSON.stringify({model:MODEL,messages:msgs,temperature:.4,top_p:1,max_tokens:1200,stream:false});
    const hdrs={'Content-Type':'application/json'};
    const res = await fetchAI(body, hdrs);
    const data=await res.json();
    let rawReply=data.choices?.[0]?.message?.content||'';

    // Retry once if model returns empty response
    if(!rawReply.trim()){
      console.warn('Model returned empty response, retrying...');
      try{
        const retryRes=await fetchAI(body,hdrs);
        const retryData=await retryRes.json();
        rawReply=retryData.choices?.[0]?.message?.content||'';
      }catch(retryErr){
        console.warn('Retry also failed:',retryErr.message);
      }
    }

    const reply=polishAIReply(rawReply||'Sorry, I could not generate a response.',text);
    const t=$('#aiTyping');if(t)t.remove();
    chatHistory.push({role:'assistant',content:reply});
    renderAIChat();renderAIQuick();
  }catch(err){
    const t=$('#aiTyping');if(t)t.remove();
    let errMsg='⚠️ ' + err.message;
    chatHistory.push({role:'assistant',content:errMsg});
    renderAIChat();
  }finally{
    aiLoading=false;
    $('#aiSend').disabled=false;
    inp.disabled=false;
    inp.placeholder="Ask anything...";
    setTimeout(() => inp.focus(), 50);
  }
}

$('#aiSend').onclick=sendAIMsg;
$('#aiInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAIMsg()}};
