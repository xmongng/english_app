function renderTableHtml(tableLines) {
  if (tableLines.length < 2) return '';
  const headers = tableLines[0].split('|').slice(1, -1).map(h => h.trim());
  
  const alignLines = tableLines[1].split('|').slice(1, -1).map(a => {
    const t = a.trim();
    if (t.startsWith(':') && t.endsWith(':')) return 'center';
    if (t.endsWith(':')) return 'right';
    return 'left';
  });
  
  const dataRows = tableLines.slice(2).map(row => {
    return row.split('|').slice(1, -1).map(c => c.trim());
  });
  
  let html = '<div class="table-responsive"><table class="markdown-table">';
  
  html += '<thead><tr>';
  headers.forEach((h, idx) => {
    const align = alignLines[idx] || 'left';
    html += `<th style="text-align: ${align}">${fmtMarkdownInline(h)}</th>`;
  });
  html += '</tr></thead>';
  
  html += '<tbody>';
  dataRows.forEach(row => {
    html += '<tr>';
    headers.forEach((_, idx) => {
      const cellText = row[idx] || '';
      const align = alignLines[idx] || 'left';
      html += `<td style="text-align: ${align}">${fmtMarkdownInline(cellText)}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function fmtAI(t){
  if(!t)return '';
  const lines = t.split('\n');
  const processed = [];
  let i = 0;
  
  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();
    
    // 1. Detect Markdown Table
    if (trimmed.startsWith('|') && trimmed.endsWith('|') && (trimmed.match(/\|/g) || []).length >= 2) {
      if (i + 1 < lines.length) {
        const nextLine = lines[i + 1].trim();
        if (nextLine.startsWith('|') && nextLine.endsWith('|') && /^[|:\-\s]+$/.test(nextLine)) {
          const tableLines = [trimmed, nextLine];
          let j = i + 2;
          while (j < lines.length) {
            const dl = lines[j].trim();
            if (dl.startsWith('|') && dl.endsWith('|') && (dl.match(/\|/g) || []).length >= 2) {
              tableLines.push(dl);
              j++;
            } else {
              break;
            }
          }
          processed.push(renderTableHtml(tableLines));
          i = j;
          continue;
        }
      }
    }
    
    // 2. Detect Blockquote
    if (trimmed.startsWith('>')) {
      const quoteText = trimmed.substring(1).trim();
      processed.push(`<blockquote class="md-quote">${fmtMarkdownInline(quoteText)}</blockquote>`);
      i++;
      continue;
    }
    
    // 3. Detect Headings
    if (trimmed.startsWith('#')) {
      const hashCount = trimmed.match(/^#+/)[0].length;
      const headingText = trimmed.substring(hashCount).trim();
      if (hashCount >= 1 && hashCount <= 6) {
        const level = Math.min(hashCount + 2, 6);
        processed.push(`<h${level} class="md-h${level}">${fmtMarkdownInline(headingText)}</h${level}>`);
        i++;
        continue;
      }
    }
    
    // 4. Detect Unordered List Items
    if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
      const itemText = trimmed.substring(2).trim();
      processed.push(`<div class="md-list-item"><span class="md-bullet">•</span> <div>${fmtMarkdownInline(itemText)}</div></div>`);
      i++;
      continue;
    }
    
    // 5. Detect Ordered List Items
    const olMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
    if (olMatch) {
      const num = olMatch[1];
      const itemText = olMatch[2];
      processed.push(`<div class="md-list-item"><span class="md-bullet">${num}.</span> <div>${fmtMarkdownInline(itemText)}</div></div>`);
      i++;
      continue;
    }
    
    // 6. Paragraph spacing on blank lines
    if (trimmed === '') {
      processed.push('<div class="md-para-space"></div>');
      i++;
      continue;
    }
    
    // 7. Detect AI Alert Prefix labels
    const colonIdx = trimmed.indexOf(':');
    if (colonIdx !== -1) {
      const prefixPart = trimmed.substring(0, colonIdx).replace(/[\*\#\_]/g, '').trim();
      const contentPart = trimmed.substring(colonIdx + 1).trim();
      
      const isAlert = /^(Corrected|Correction|Suggested\s+fix|Better|Should\s+be|Mistake|Error|Incorrect|Incorrect\s+sentence|Explanation|Why|Rule|Grammar\s+Rule|Tip|Note|Advice)$/i.test(prefixPart);
      if (isAlert) {
        const lowerContent = contentPart.replace(/[*_`]/g, '').trim().toLowerCase();
        const startsWithNone = !lowerContent || /^(none|n\/a|no\s+errors?|no\s+mistakes?)\b/i.test(lowerContent);
        if (startsWithNone) {
          i++;
          continue;
        }
      }
      
      if (/^(Corrected|Correction|Suggested\s+fix|Better|Should\s+be)$/i.test(prefixPart)) {
        processed.push(`<div class="ai-alert ai-alert-success">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="ai-alert-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          <div><strong>Corrected:</strong> ${fmtMarkdownInline(contentPart)}</div>
        </div>`);
        i++;
        continue;
      }
      if (/^(Mistake|Error|Incorrect|Incorrect\s+sentence)$/i.test(prefixPart)) {
        processed.push(`<div class="ai-alert ai-alert-danger">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="ai-alert-icon"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
          <div><strong>Mistake:</strong> ${fmtMarkdownInline(contentPart)}</div>
        </div>`);
        i++;
        continue;
      }
      if (/^(Explanation|Why|Rule|Grammar\s+Rule)$/i.test(prefixPart)) {
        processed.push(`<div class="ai-alert ai-alert-warning">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="ai-alert-icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          <div><strong>Explanation:</strong> ${fmtMarkdownInline(contentPart)}</div>
        </div>`);
        i++;
        continue;
      }
      if (/^(Tip|Note|Advice)$/i.test(prefixPart)) {
        processed.push(`<div class="ai-alert ai-alert-info">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="ai-alert-icon"><path d="M9 18h6M10 22h4M12 2a8 8 0 0 0-8 8c0 2.2 1.2 4.1 3 5.2v2.8h10v-2.8c1.8-1.1 3-3 3-5.2a8 8 0 0 0-8-8z"></path></svg>
          <div><strong>Tip:</strong> ${fmtMarkdownInline(contentPart)}</div>
        </div>`);
        i++;
        continue;
      }
      if (/^(Pronunciation)$/i.test(prefixPart)) {
        const parts = contentPart.split('|');
        let ipa = '';
        let guide = '';
        let word = '';
        parts.forEach(p => {
          const colon = p.indexOf(':');
          if (colon !== -1) {
            const k = p.substring(0, colon).trim().toLowerCase();
            const v = p.substring(colon + 1).trim();
            if (k.includes('word')) word = v;
            else if (k.includes('guide')) guide = v;
          } else {
            if (p.trim().startsWith('/')) {
              ipa = p.trim();
            }
          }
        });
        if (!ipa) {
          const matchIpa = contentPart.match(/\/([^\/]+)\//);
          if (matchIpa) ipa = matchIpa[0];
        }
        const cleanWord = word.replace(/['"“”]/g, '');
        processed.push(`<div class="pronunciation-card">
          <div class="pron-row">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="pron-word">${word || 'Word'}</span>
              <span class="pron-ipa">${ipa || '/.../'}</span>
            </div>
            <button class="pron-speak-btn" onclick="speak('${cleanWord.replace(/'/g, "\\'")}')" title="Listen Pronunciation">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
          </div>
          <div class="pron-guide"><strong>Guide:</strong> ${guide || 'No pronunciation guide description provided.'}</div>
        </div>`);
        i++;
        continue;
      }
    }
    
    // 8. Normal line
    processed.push(fmtMarkdownInline(line));
    i++;
  }
  
  let finalHtml = '';
  for (let k = 0; k < processed.length; k++) {
    const current = processed[k];
    const next = processed[k + 1];
    finalHtml += current;
    if (next !== undefined) {
      const isCurrentBlock = current.startsWith('<div') || current.startsWith('<blockquote') || current.startsWith('<h') || current.startsWith('<table');
      const isNextBlock = next.startsWith('<div') || next.startsWith('<blockquote') || next.startsWith('<h') || next.startsWith('<table');
      if (!isCurrentBlock && !isNextBlock) {
        finalHtml += '<br>';
      }
    }
  }
  return finalHtml;
}

function fmtMarkdownInline(text) {
  return esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
             .replace(/\*(.+?)\*/g,'<em>$1</em>')
             .replace(/`(.+?)`/g,'<code class="code-chip">$1</code>');
}

function goHome(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(!ensureAppReady())return;
  currentGroupId=null;currentDayId=null;activity=null;wIdx=0;
  $('#homePage').classList.add('active');
  $('#groupPage').classList.remove('active');
  $('#dayPage').classList.remove('active');
  $('#backBtn').classList.remove('show');
  setWorkspaceHeaderVisible(true);
  $('#homePage').style.animation='none';$('#homePage').offsetHeight;$('#homePage').style.animation='';
  renderHome();updateAIContext();
}
function goGroup(topicName){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(!ensureAppReady())return;
  currentGroupId=topicName;currentDayId=null;activity=null;wIdx=0;
  $('#homePage').classList.remove('active');
  $('#groupPage').classList.add('active');
  $('#dayPage').classList.remove('active');
  $('#backBtn').classList.add('show');
  setWorkspaceHeaderVisible(false);
  $('#groupPage').style.animation='none';$('#groupPage').offsetHeight;$('#groupPage').style.animation='';
  renderGroup();updateAIContext();
}
function goDay(id,initialActivity=null){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(!ensureAppReady())return;
  currentDayId=id;
  if(id==='r:smart')dayTab='study';
  const day = getDay(id);
  if (day) {
    currentGroupId = dayTopic(day);
  }
  activity=initialActivity;wIdx=0;
  $('#homePage').classList.remove('active');
  $('#groupPage').classList.remove('active');
  $('#dayPage').classList.add('active');
  $('#backBtn').classList.add('show');
  setWorkspaceHeaderVisible(false);
  $('#dayPage').style.animation='none';$('#dayPage').offsetHeight;$('#dayPage').style.animation='';
  renderDay();updateAIContext();
}
function goBack(){
  if(currentDayId){
    if(currentDayId==='r:smart'){
      smartReviewWords=[];
      currentDayId=null;currentGroupId=null;activity=null;
      switchMainTab('learn');
      goHome();
    }else if (currentDayId.startsWith('t:')) {
      goGroup(currentDayId.slice(2));
    } else {
      const d=days.find(x=>x.id===currentDayId);
      if(d) {
        goGroup(dayTopic(d));
      } else {
        goHome();
      }
    }

function saveCustomTopics() {
  localStorage.setItem('customTopics', JSON.stringify(customTopics));
  if (typeof stats === 'object' && stats) stats.customTopics = [...customTopics];
}

function seedCustomTopics() {
  const ts = new Set(customTopics);
  days.forEach(d => {
    const dt = dayTopic(d);
    if (dt && dt !== 'General') ts.add(dt);
    (d.words || []).forEach(w => {
      if (w.topic && w.topic !== 'General') ts.add(w.topic);
    });
  });
  customTopics = [...ts].sort();
  saveCustomTopics();
}

async function doRenameGroup() {
  const newName = $('#mRenameGroup').value.trim();
  if (!newName) { toast('Group name required'); return; }
  if (newName === currentGroupId) { closeModal(); return; }
  if (customTopics.includes(newName)) { toast('Group name already exists'); return; }
  
  const oldName = currentGroupId;
  const idx = customTopics.indexOf(oldName);
  if (idx >= 0) customTopics[idx] = newName;
  saveCustomTopics();
  
  days.forEach(d => {
    if (d.topic === oldName) {
      d.topic = newName;
    }
  });
  
  days.forEach(d => {
    (d.words || []).forEach(w => {
      if (w.topic === oldName) {
        w.topic = newName;
      }
    });
  });
  
  practiceLogs.forEach(l => {
    if (l.dayId === 't:' + oldName) {
      l.dayId = 't:' + newName;
    }
  });
  mistakePatterns.forEach(m => {
    if (m.dayId === 't:' + oldName) {
      m.dayId = 't:' + newName;
    }
  });
  
  currentGroupId = newName;
  await save();
  closeModal();
  renderGroup();
  toast('Group renamed');
}

async function deleteGroupPrompt() {
  if (!confirm(`Are you sure you want to delete the group "${currentGroupId}" and all its lessons? This cannot be undone.`)) return;
  
  const targetGroupId = currentGroupId;
  const daysToDelete = days.filter(d => dayTopic(d) === targetGroupId);
  const dayIdsToDelete = new Set(daysToDelete.map(d => d.id));
  
  // 1. Delete associated days, mistake patterns, and practice logs in cloud
  if (dataService.mode === 'cloud') {
    const cloudDeletions = [];
    for (const d of daysToDelete) {
      if (dataService.daysRef) {
        cloudDeletions.push(dataService.daysRef.doc(d.id).delete().catch(err => console.warn(err)));
      }
    }
    const mistakesToDelete = mistakePatterns.filter(m => dayIdsToDelete.has(m.dayId));
    for (const m of mistakesToDelete) {
      const sig = m.signature || m.id;
      if (dataService.mistakePatternsRef) {
        cloudDeletions.push(dataService.mistakePatternsRef.doc(sig).delete().catch(err => console.warn(err)));
      }
    }
    const logsToDelete = practiceLogs.filter(l => dayIdsToDelete.has(l.dayId));
    for (const l of logsToDelete) {
      if (dataService.practiceLogsRef) {
        cloudDeletions.push(dataService.practiceLogsRef.doc(l.id).delete().catch(err => console.warn(err)));
      }
    }
    await Promise.all(cloudDeletions);
  }
  
  // 2. Remove the deleted topic from surviving words before filtering days.
  // Otherwise an orphaned word can cause seedCustomTopics() to recreate it
  // after the next reload.
  days.forEach(d => {
    (d.words || []).forEach(w => {
      if (w.topic === targetGroupId) delete w.topic;
    });
  });

  // 3. Filter local in-memory collections
  mistakePatterns = mistakePatterns.filter(m => !dayIdsToDelete.has(m.dayId));
  practiceLogs = practiceLogs.filter(l => !dayIdsToDelete.has(l.dayId));
  days = days.filter(d => dayTopic(d) !== targetGroupId);

  // 4. Update customTopics and flush the final local/cloud state.
  customTopics = customTopics.filter(t => t !== targetGroupId);
  saveCustomTopics();
  await dataService.flushCloudSync();
  goHome();
  toast('Group deleted');
}

function getGroupDays(groupId) {
  const groupDays = days.filter(d => dayTopic(d) === groupId);
  
  // Find all words belonging to this topic
  const allGroupWords = [];
  days.forEach(d => {
    const dt = dayTopic(d);
    d.words.forEach(w => {
      if ((w.topic || dt) === groupId) {
        allGroupWords.push(w);
      }
    });
  });
  
  const wordsInGroupDays = new Set();
  groupDays.forEach(d => {
    d.words.forEach(w => {
      wordsInGroupDays.add(norm(w.en));
    });
  });
  
  const orphanWords = allGroupWords.filter(w => !wordsInGroupDays.has(norm(w.en)));
  
  if (orphanWords.length > 0) {
    groupDays.push({
      id: 't:' + groupId,
      name: `Imported / Other Words`,
      date: new Date().toISOString().slice(0, 10),
      words: orphanWords,
      goal: `Vocabulary imported or moved to this group`,
      isVirtual: true
    });
  }
  return groupDays;
}

function renderGroup() {
  if (!currentGroupId) return;

function filteredWords(day){
  let arr=day.words.map((w,i)=>({...w,_i:i}));const q=norm(vocabFilters.q);
  if(q)arr=arr.filter(w=>norm(`${w.en} ${w.vi} ${w.meaning} ${w.example}`).includes(q));
  if(vocabFilters.status==='mastered')arr=arr.filter(w=>wordLearningStage(w)==='Durable');
  if(vocabFilters.status==='unmastered')arr=arr.filter(w=>wordLearningStage(w)!=='Durable');
  if(vocabFilters.status==='mistakes')arr=arr.filter(w=>activeMistakesForWord(w.en).length);
  if(vocabFilters.sort==='az')arr.sort((a,b)=>a.en.localeCompare(b.en));
  if(vocabFilters.sort==='mastery')arr.sort((a,b)=>(wordLearningStage(a)==='Durable')-(wordLearningStage(b)==='Durable'));
  if(vocabFilters.sort==='mistakes')arr.sort((a,b)=>activeMistakesForWord(b.en).length-activeMistakesForWord(a.en).length);
  return arr;
}

function startActivity(act){
  const day=getDay(currentDayId);
  if(!day||day.words.length===0){toast('Add some words first');return}

}

function setComposeMode(mode){
  if (composeMode !== mode) clearReviewCaches();
  composeMode=mode;
  renderDay();
}

function backToActivities(){activity=null;renderDay()}

function curWord(){const d=getDay(currentDayId);if(!d||!d.words.length)return null;return d.words[wIdx%d.words.length]}
function finishSmartReviewSession(){
  smartReviewWords=[];
  currentDayId=null;currentGroupId=null;activity=null;wIdx=0;

}
function nextW(){
  const d=getDay(currentDayId);if(!d)return;
  if(currentDayId==='r:smart'&&wIdx>=d.words.length-1){finishSmartReviewSession();return}

}
function prevW(){const d=getDay(currentDayId);if(!d)return;clearReviewCaches();flashFlipped=false;flashRated=false;wIdx=(wIdx-1+d.words.length)%d.words.length;renderDay()}
function randW(){const d=getDay(currentDayId);if(!d||d.words.length<2)return;clearReviewCaches();flashFlipped=false;flashRated=false;let n;do{n=Math.floor(Math.random()*d.words.length)}while(n===wIdx);wIdx=n;renderDay()}

async function markPractice(ok,extra={}){
  const w=curWord();if(!w)return false;
  const now=new Date();const dayKey=localDateKey(now);
  stats.activityDays=stats.activityDays||{};
  const entry=stats.activityDays[dayKey]||{count:0,xp:0,credits:[]};
  const mode=activity==='compose'?`compose:${composeMode}`:(activity||'practice');
  entry.credits=entry.credits||[];
  const creditKey=`${norm(w.en)}|${mode}`;
  const grantsCredit=extra.grantsCredit!==false;
  if(grantsCredit&&entry.credits.includes(creditKey))return false;
  if(grantsCredit){entry.credits.push(creditKey);entry.count++;}
  stats.activityDays[dayKey]=entry;
  const scored=activity!=='flash';
  stats.done=(stats.done||0)+1;
  if(scored){stats.total=(stats.total||0)+1;if(ok)stats.correct=(stats.correct||0)+1;}
  // Incorrect answers are useful accuracy evidence, but never earn XP.
  const base=ok?(activity==='flash'?4:activity==='compose'?15:10):0;
  const earned=Math.min(base,Math.max(0,100-(entry.xp||0)));entry.xp=(entry.xp||0)+earned;
  awardXP(earned,'Daily practice');
  updateWordReviewSchedule(w,ok,extra);
  const payload={dayId:findWordInOriginalDays(w.en)?.day.id||currentDayId,word:w.en,activity:activity||'practice',ok,scored,score:Number.isFinite(extra.score)?extra.score:null,studyDate:dayKey,creditKey:grantsCredit?creditKey:`${creditKey}|incorrect`,xp:earned,createdAt:now.toISOString(),errorSignature:extra.errorSignature||null,reviewMode:currentDayId==='r:smart'?'smart':'lesson'};
  // Local log and summary are updated synchronously; cloud writes run afterwards.
  const sync=dataService.addPracticeLog(payload);
  stats.streak=calculateStudyHabit().current;
  await save();updateTopStats();
  sync.catch(err=>console.warn('Practice sync failed',err));
  return true;
}

function markMastered(en){
  if(stats.mastered[en])return;
  const wasSmartReview=currentDayId==='r:smart';
  stats.mastered[en]=true;
  const meta=reviewMetaFor(en,true);
  meta.manualReview=false;meta.masteredAt=new Date().toISOString();meta.level=Math.max(meta.level||0,4);meta.nextReviewAt=addReviewDays(60);
  smartReviewWords=smartReviewWords.filter(word=>norm(word.en)!==norm(en));
  // Manual mastery is a preference, not evidence of a scored attempt.
  updateTopStats();
  if(wasSmartReview){
    if(!smartReviewWords.length){
      currentDayId=null;currentGroupId=null;activity=null;wIdx=0;
      smartReviewTabView='vocabulary';
      switchMainTab('review');
    }else{
      wIdx=Math.min(wIdx,smartReviewWords.length-1);
      renderDay();
    }
  }else if(currentMainTab==='review'){
    renderSmartReviewTab();
  }else if(currentDayId){
    renderDay();
  }else{
    renderHome();
  }
  toast('Word mastered and removed from Smart Review.');
  save();
}

function toggleMastered(en){
  const isMastered=Boolean(stats.mastered[en]);
  if(isMastered){
    delete stats.mastered[en];
    const meta=reviewMetaFor(en);
    if(meta){
      delete meta.masteredAt;
      meta.level=Math.min(meta.level||0,2);
    }
    toast('Unmarked from mastered.');
    save();
    updateTopStats();
    if(currentDayId)renderDay();
    else if(currentMainTab==='review')renderSmartReviewTab();
    else renderHome();
  }else{
    markMastered(en);
  }
}

async function rateFlash(level){
  if(flashRated||!flashFlipped)return;
  flashRated=true;flashTurns++;
  const w=curWord();
  const meta=reviewMetaFor(w.en,true);
  if(level==='hard'){
    await markPractice(false);
  }else{
    const recorded=await markPractice(true);
    if(level==='easy'&&recorded){
      meta.level=Math.min(REVIEW_INTERVALS.length,Math.max(2,meta.level||0));
      meta.intervalDays=REVIEW_INTERVALS[meta.level-1];
      meta.nextReviewAt=addReviewDays(meta.intervalDays);
      save();
    }
  }
  const d=getDay(currentDayId);
  if(d?.words?.length>1){
    const weighted=d.words.map((word,index)=>({index,priority:reviewPriority(word)})).filter(item=>item.index!==wIdx).sort((a,b)=>b.priority-a.priority);
    wIdx=weighted[0]?.index??((wIdx+1)%d.words.length);
  }
  flashFlipped=false;flashRated=false;renderDay();
}
function startQuizSession(day){
  const questions=[...day.words].sort((a,b)=>reviewPriority(b)-reviewPriority(a)).slice(0,Math.min(10,day.words.length));
  quizSession={questions,index:0,score:0,answered:false,lastCorrect:null,options:[]};
  prepareQuizOptions(day);
}
function prepareQuizOptions(day){
  if(!quizSession||quizSession.index>=quizSession.questions.length)return;
  const question=quizSession.questions[quizSession.index];
  quizSession.options=[question,...day.words.filter(item=>norm(item.en)!==norm(question.en)).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
}
function nextQuizQuestion(){if(!quizSession)return;quizSession.index++;quizSession.answered=false;quizSession.lastCorrect=null;prepareQuizOptions(getDay(currentDayId));renderDay()}
function restartQuiz(){startQuizSession(getDay(currentDayId));renderDay()}
async function answerQuizQuestion(ok){
  if(!quizSession||quizSession.answered)return;
  quizSession.answered=true;
  quizSession.lastCorrect=ok;
  if(ok)quizSession.score++;
  const q=quizSession.questions[quizSession.index];
  const originalIndex=getDay(currentDayId).words.findIndex(w=>norm(w.en)===norm(q.en));
  if(originalIndex>=0)wIdx=originalIndex;
  markPractice(ok).catch(err=>console.warn('Quiz sync failed:',err));
  renderDay();
}
function startMatchingSession(day){
  const words=[...day.words].sort(()=>Math.random()-.5).slice(0,Math.min(6,day.words.length));
  matchingSession={words,selected:null,matched:new Set(),busy:false};
}
function restartMatching(){startMatchingSession(getDay(currentDayId));renderDay()}
async function selectMatchTile(index,side){
  const session=matchingSession;
  if(!session||session.busy||session.matched.has(index))return;
  const selected=session.selected;
  if(!selected){session.selected={index,side};renderDay();return}
  if(selected.index===index&&selected.side===side){session.selected=null;renderDay();return}
  if(selected.index===index&&selected.side!==side){
    session.matched.add(index);session.selected=null;
    const originalIndex=getDay(currentDayId).words.findIndex(w=>norm(w.en)===norm(session.words[index].en));
    if(originalIndex>=0)wIdx=originalIndex;
    markPractice(true).catch(err=>console.warn('Matching sync failed:',err));
    renderDay();return;
  }
  const target=session.words[selected.side==='en'?selected.index:index];
  wIdx=getDay(currentDayId).words.findIndex(w=>norm(w.en)===norm(target.en));
  markPractice(false);
  session.busy=true;session.selected=null;
  $('#matchFeedback').textContent='Try another pair.';
  setTimeout(()=>{session.busy=false;if(activity==='match'&&matchingSession===session)renderDay()},450);
}

function bindRecallPractice(){

    recallCheck._bound=true;
    const w=curWord();
    let submitted=false,incorrectRecorded=false;
    const check=async()=>{
      const value=$('#recallIn')?.value?.trim();if(!value||submitted)return;
      const ok=norm(value)===norm(w.en);
      const fb=$('#recallFb');fb.className='feedback '+(ok?'fb-good':'fb-bad');
      if(!ok){
        if(!incorrectRecorded){
          incorrectRecorded=true;
          await markPractice(false,{grantsCredit:false}).catch(err=>console.warn('Typing sync failed:',err));
        }
        fb.textContent='Not quite. Check the spelling and try again.';
        const input=$('#recallIn');if(input){input.select();input.focus();}

      }
      submitted=true;
      recallCheck.disabled=true;

      fb.textContent='Correct! Well done.';
      const expectedDay=currentDayId;const expectedIndex=wIdx;
      setTimeout(()=>{if(currentDayId===expectedDay&&activity==='recall'&&wIdx===expectedIndex)nextW()},1200);
    };
    recallCheck.onclick=check;
    const inp=$('#recallIn');if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')check()}}
  }
}

      try {
        const cacheKey = `${viPrompt}|||${val}`;
        let result = translationReviewCache.get(cacheKey);
        if (!result) {

          result = accepted
            ? acceptedCorrectionResult(val,accepted)
            : normalizeTranslationReviewResult(await requestTranslationReview(w.en, viPrompt, val),val,w.en);

          if(recorded)markRelatedErrorsReviewed(w.en,val);
          fb.className = 'feedback fb-good';
          fb.innerHTML = `<span class="score-badge">Practice score: ${analysis.score ?? '—'}/9</span><br>${fmtAI(result.reply || analysis.feedback || 'Great translation! Accurate and natural.')}`;
        }
      } catch (err) {
        fb.className = 'feedback fb-bad';
        fb.innerHTML = `AI translation review unavailable right now. Your attempt was not scored: ${esc(err.message)}`;
      }finally{translateCheck.disabled=false;}
    };
  }

  // Translate New Prompt
  const translateNewPrompt = $('#translateNewPrompt');

  // Speed

async function doRename(){
  const d=getDay(currentDayId);if(!d)return;
  
  const name = $('#mRenameName').value.trim() || 'Untitled';
  const topic = $('#mRenameTopic').value.trim() || 'General';
  const goal = $('#mRenameGoal').value.trim();
  const date = $('#mRenameDate').value || new Date().toISOString().slice(0,10);
  
  if (topic !== 'General' && !customTopics.includes(topic)) {
    customTopics.push(topic);
    saveCustomTopics();
  }
  
  if (d.isVirtual) {
    const newDayId = 'd' + Date.now();
    const realDay = {
      id: newDayId,
      name: name,
      date: date,
      topic: topic,
      goal: goal,
      createdAt: new Date().toISOString(),
      words: [...d.words]
    };
    
    // Clean original days
    const wordSpellings = new Set(d.words.map(w => norm(w.en)));
    days.forEach(originalDay => {
      originalDay.words = originalDay.words.filter(w => !wordSpellings.has(norm(w.en)));
    });
    
    // Update logs and mistakes
    practiceLogs.forEach(l => {
      if (l.word && wordSpellings.has(norm(l.word))) {
        l.dayId = newDayId;
      }
    });
    mistakePatterns.forEach(m => {
      if (m.targetWord && wordSpellings.has(norm(m.targetWord))) {
        m.dayId = newDayId;
      }
    });
    
    // Update topic for words in the new day
    realDay.words.forEach(w => {
      w.topic = topic;
    });
    
    days.push(realDay);
    currentDayId = newDayId;
    currentGroupId = topic;
  } else {
    const oldTopic = dayTopic(d);
    d.name = name;
    d.topic = topic;
    d.goal = goal;
    d.date = date;
    
    // Update all words' topic tags if they match the old topic
    d.words.forEach(w => {
      if (!w.topic || w.topic === oldTopic) {
        w.topic = topic;
      }
    });
    
    currentGroupId = topic;
  }
  
  await save();
  closeModal();
  renderDay();
  toast('Lesson details updated');
}
async function deleteDay(){
  if(!confirm('Delete this day and all words?'))return;
  const d=getDay(currentDayId);
  if(!d)return;
  
  const dayIdToDelete = currentDayId;
  const topicName = dayTopic(d);
  const deletedWords=new Set(d.words.map(w=>norm(w.en)));
  
  d.words.forEach(w=>{
    delete stats.mastered[w.en];
  });
  
  const mistakesToDelete = mistakePatterns.filter(m => m.dayId === dayIdToDelete || deletedWords.has(norm(m.targetWord)));
  for (const m of mistakesToDelete) {
    const signature = m.signature || m.id;
    const idx = mistakePatterns.findIndex(p => p.signature === signature);
    if(idx>=0) mistakePatterns.splice(idx,1);
    if (dataService.mode === 'cloud' && dataService.mistakePatternsRef) {
      await dataService.mistakePatternsRef.doc(signature).delete().catch(err => console.warn(err));
    }
  }
  
  const logsToDelete = practiceLogs.filter(l => l.dayId === dayIdToDelete);
  for (const l of logsToDelete) {
    const idx = practiceLogs.findIndex(pl => pl.id === l.id);
    if(idx>=0) practiceLogs.splice(idx,1);
    if (dataService.mode === 'cloud' && dataService.practiceLogsRef) {
      await dataService.practiceLogsRef.doc(l.id).delete().catch(err => console.warn(err));
    }
  }
  
  if (dataService.mode === 'cloud' && dataService.daysRef) {
    await dataService.daysRef.doc(dayIdToDelete).delete().catch(err => console.warn('Cloud day deletion failed:', err));
  }
  
  days=days.filter(day=>day.id!==dayIdToDelete);

  // Remove an unused tag as well. Tags are derived from live lessons/words
  // during startup, so leaving this metadata behind makes deleted tags return.
  const topicStillUsed = days.some(day =>
    dayTopic(day) === topicName || (day.words || []).some(w => w.topic === topicName)
  );
  if (topicName && topicName !== 'General' && !topicStillUsed) {
    customTopics = customTopics.filter(topic => topic !== topicName);
    saveCustomTopics();
  }

  // If this was the last day, perform a full cloud wipe so no stale data remains
  if (days.length === 0) {
    stats = {...DEFAULT_STATS, mastered:{}};
    customTopics = [];
    mistakePatterns = [];
    practiceLogs = [];
    errorMemory = [];
    progressSummary = buildProgressSummary();
    localStore.clear();
    saveCustomTopics();
    if (dataService.mode === 'cloud') {
      toast('Clearing all cloud data...');
      try {
        // Wipe all subcollections in parallel
        const [mpSnap, plSnap, erSnap, daysSnap] = await Promise.all([
          dataService.mistakePatternsRef ? dataService.mistakePatternsRef.get().catch(()=>null) : null,
          dataService.practiceLogsRef    ? dataService.practiceLogsRef.get().catch(()=>null)    : null,
          dataService.errorsRef          ? dataService.errorsRef.get().catch(()=>null)           : null,
          dataService.daysRef            ? dataService.daysRef.get().catch(()=>null)             : null
        ]);
        const deletes = [];
        [mpSnap, plSnap, erSnap, daysSnap].forEach(snap => {
          if (snap && !snap.empty) snap.forEach(doc => deletes.push(doc.ref.delete()));
        });
        if (dataService.statsRef)    deletes.push(dataService.statsRef.delete().catch(()=>{}));
        if (dataService.progressRef) deletes.push(dataService.progressRef.delete().catch(()=>{}));
        await Promise.all(deletes);
      } catch(e) { console.warn('Cloud wipe error:', e); }
    }
    goHome();
    toast('All data cleared. Start fresh!');
    return;
  }

  await dataService.flushCloudSync();
  if (topicName && topicName !== 'General' && days.some(day => dayTopic(day) === topicName)) {
    goGroup(topicName);
  } else {
    goHome();
  }
  toast('Day and associated data deleted');
}

function extractBalancedJson(text,startChar,endChar){
  const start=text.indexOf(startChar);if(start<0)return null;
  let depth=0,inStr=false,escp=false;
  for(let i=start;i<text.length;i++){
    const ch=text[i];
    if(inStr){
      if(escp){escp=false;continue}
      if(ch==='\\'){escp=true;continue}
      if(ch==='"')inStr=false;
      continue;
    }
    if(ch==='"'){inStr=true;continue}
    if(ch===startChar)depth++;
    if(ch===endChar){
      depth--;
      if(depth===0)return text.slice(start,i+1);
    }
  }
  return null;
}
function normalizeEnhancedItems(payload){
  let arr=Array.isArray(payload)?payload:null;
  if(!arr&&payload&&typeof payload==='object'){
    arr=payload.items||payload.vocabulary||payload.words||payload.data||payload.result||payload.results||null;
  }
  if(!Array.isArray(arr))throw new Error('AI response did not contain a JSON array');
  return arr.map(x=>x&&typeof x==='object'?x:{});
}
function cleanJsonCandidate(text){
  return String(text||'')
    .trim()
    .replace(/^```(?:json)?\s*/i,'')
    .replace(/\s*```$/,'')
    .replace(/,\s*([}\]])/g,'$1');
}
function parseEnhancedVocabJson(text){
  const raw=String(text||'').trim();
  const candidates=[
    raw,
    cleanJsonCandidate(raw),
    extractBalancedJson(raw,'[',']'),
    extractBalancedJson(raw,'{','}')
  ].filter(Boolean).flatMap(candidate=>[candidate,cleanJsonCandidate(candidate)]);
  for(const candidate of candidates){
    try{return normalizeEnhancedItems(JSON.parse(candidate))}catch{}
  }
  throw new Error('Could not parse AI enhancement JSON. Raw output: '+raw.slice(0,220));
}
function readAIMessageText(data){
  const msg=data?.choices?.[0]?.message;
  const content=msg?.content??data?.output_text??data?.content??data?.text??'';
  if(typeof content==='string')return content;
  if(Array.isArray(content))return content.map(part=>{
    if(typeof part==='string')return part;
    return part?.text||part?.content||part?.value||'';
  }).join('\n');
  if(content&&typeof content==='object')return content.text||content.content||content.value||JSON.stringify(content);
  return '';
}
function polishNaturalCorrectionText(text){
  if(!text)return text;
  return String(text).replace(
    /I don't understand what the difference is between ([^,\n?]+?) and ([^,\n?]+?),?\s+(?:and|or)\s+how to use (?:them|it)\.?/i,
    (_,a,b)=>`I don't understand the difference between ${a.trim()} and ${b.trim()}, or how to use these terms.`
  ).replace(
    /I (?:still can['’]t|can['’]t even) use (?:the|that) idiom (?:above )?in (?:a )?real conversations?;\s*I['’]m bad, huh\?/i,
    "I still can't use that idiom naturally in real conversations. I'm pretty bad at this, huh?"
  ).replace(
    /I don['’]t understand the difference between ([^,\n?]+?) and ([^,\n?]+?),?\s+or how to use them\.?/i,
    (_,a,b)=>`I don't understand the difference between ${a.trim()} and ${b.trim()}, or how to use these terms.`
  ).replace(
    /Let me give you some examples\.?/i,
    'Give me some examples.'
  );
}
function stripMarkdownMarkers(text){
  return String(text||'').replace(/[*_`]/g,'').replace(/[“”"']/g,'').trim();
}
function cleanPronunciationTarget(text){
  return stripMarkdownMarkers(text)
    .replace(/\b(?:the\s+)+real\s+conversation\b.*$/i,'')
    .replace(/\bin\s+real\s+conversation\b.*$/i,'')
    .replace(/\bthe\s*$/i,'')
    .trim();
}
function getPronunciationTarget(userText,reply){
  const user=String(userText||'');
  const quoted=user.match(/["“']([^"”']+)["”']/);
  if(quoted)return cleanPronunciationTarget(quoted[1]);
  const wordLabel=user.match(/\b(?:word|phrase)\s*:?\s*([^?.,\n]+)/i);
  if(wordLabel)return cleanPronunciationTarget(wordLabel[1]);
  const pronounce=user.match(/\bpronounce(?:\s+and\s+use)?(?:\s+the\s+(?:word|phrase))?\s+([^?.,\n]+)/i);
  if(pronounce)return cleanPronunciationTarget(pronounce[1]);
  const wordInReply=String(reply||'').match(/\bWord:\s*([^|\n]+)/i);
  return wordInReply?cleanPronunciationTarget(wordInReply[1]):'target';
}
function normalizePronunciationReply(reply,userText=''){
  let out=String(reply||'');
  if(!/\b(how\s+to\s+pronounce|how\s+do\s+\w+\s+pronounce|how\s+to\s+say|how\s+do\s+\w+\s+say|pronunciation\s+of|pronunciation\s+for|pronunciation\s+guide|phonetic\s+(?:spelling|guide|representation)|IPA)\b/i.test(userText))return out;
  if(/^Pronunciation:\s*\/[^/\n]+\/\s*\|\s*Guide:\s*[^|\n]+\|\s*Word:\s*[^\n]+/i.test(out.trim()))return out;
  const ipa=(out.match(/\/[^/\n]+\//)||[])[0]||'/.../';
  const plainOut=stripMarkdownMarkers(out);
  let guide='';
  const sayLine=plainOut.match(/Say it as:\s*([^\n]+)/i);
  if(sayLine)guide=stripMarkdownMarkers(sayLine[1]);
  const guideLine=plainOut.match(/(?:Guide(?:\s*\([^)]*\))?|Syllable guide)\s*:?\s*([^\n]+)/i);
  if(!guide&&guideLine)guide=stripMarkdownMarkers(guideLine[1]);
  const target=stripMarkdownMarkers(getPronunciationTarget(userText,out));
  if(!guide||/^[|\s-]+$/.test(guide)||/^\/[^/]+\/\.?$/.test(guide))guide=target.split(/\s+/).map(part=>part.toUpperCase()).join(' ');
  return `Pronunciation: ${ipa} | Guide: ${guide} | Word: ${target}\n\n${out}`;
}
function simplifyTutorOnboardingReply(reply,userText=''){
  const request=String(userText||'').trim();
  const wantsPractice=/\b(?:i\s+)?(?:want(?:ed)?|would\s+like)\s+to\s+practice(?:\s+with\s+you)?\b/i.test(request);
  const hasMenu=/^\s*(?:practice\s+options|\d+\.|[-*]\s*(?:speaking|vocabulary|grammar|IELTS))/im.test(String(reply||''));
  if(wantsPractice&&hasMenu){
    return 'Sure. What would you like to practice today: speaking, vocabulary, grammar, or IELTS?';
  }
  return reply;
}
function polishAIReply(reply,userText=''){
  const correctionPolished=simplifyTutorOnboardingReply(
    normalizePronunciationReply(polishNaturalCorrectionText(reply),userText),
    userText
  );
  let out=correctionPolished;
  out = out.replace(/^\s*(?:No\s+mistakes?\s+to\s+correct!?|No\s+corrections?\s+(?:needed|are\s+needed|required|necessary)|Your\s+sentence\s+(?:is\s+correct|has\s+no\s+errors)|Grammar\s+check:\s*No\s+errors\s+detected)[.:]?(?:\s+anyway,)?\s*/i, '');
  if (out.length > 0) {
    out = out.charAt(0).toUpperCase() + out.slice(1);
  }
  if(/what\s+you\s+can\s+help\s+me\??/i.test(userText)){
    out=out.replace(/What can I help you with\?/gi,'What can you help me with?');
  }
  out=out
    .replace(/\bwhile background listening\b/gi,'while listening to English in the background')
    .replace(/\bduring background listening\b/gi,'while doing background listening')
    .replace(/\bas part of background listening\b/gi,'as background listening')
    .replace(/\bdo background listening while\b/gi,'listen to English in the background while')
    .replace(/\bdoing background listening while\b/gi,'listening to English in the background while')
    .replace(/\bdo background listening to\b/gi,'listen to')
    .replace(/\bdoing background listening to\b/gi,'listening to')
    .replace(/\bdo a lot of background listening\b/gi,'often keep English playing in the background')
    .replace(/\bdoing a lot of background listening\b/gi,'often keeping English playing in the background')
    .replace(/\bdo some background listening\b/gi,'keep English playing in the background')
    .replace(/\bdoing some background listening\b/gi,'keeping English playing in the background')
    .replace(/\buse podcasts as background listening\b/gi,'have podcasts on in the background')
    .replace(/\buse English podcasts as background listening\b/gi,'have English podcasts on in the background')
    .replace(/\bas\s+[*_`]*background listening[*_`]*/gi,'in the background')
    .replace(/\bimpactively\b/gi,'with a clear impact')
    .replace(/\bIt was heavy rain all afternoon\b/gi,'There was heavy rain all afternoon')
    .replace(/\bI do background listening to an English podcast while\b/gi,'I keep an English podcast on in the background while')
    .replace(/\bI use English podcasts as background listening while\b/gi,'I keep English podcasts on in the background while')
    .replace(/During the interview, I practiced background listening, letting the speaker’s words drift into the background as I took notes\./gi,'I often have an English podcast on in the background while I cook dinner.')
    .replace(/During the interview, I practiced background listening, letting the speaker's words drift into the background as I took notes\./gi,'I often have an English podcast on in the background while I cook dinner.');
  if(correctionPolished!==reply&&/what the difference is between/i.test(reply)){
    out=out.replace(
      /^Explanation:\s*.*$/mi,
      'Explanation: Use "difference" as a noun, and use the more natural pattern "understand the difference between X and Y"; "these terms" clearly refers to both expressions.'
    );
    out=out.replace(
      /^Tip:\s*.*$/mi,
      "Tip: For two vocabulary expressions, \"the difference between X and Y\" is usually cleaner than an embedded question after \"I don't understand\"."
    );
  }
  return out;
}
function chunkVocabText(rawText,chunkSize=20){return ImportFlow.chunks(rawText,chunkSize);}
async function requestVocabEnhancementSingleChunk(chunkText,defaultTopic){
  const res=await fetchAI(JSON.stringify({task:'import',text:chunkText,topic:defaultTopic,allowSplit:true}),{'Content-Type':'application/json'});
  const data=await res.json();const txt=readAIMessageText(data);
  try{return LearningCore.validateImport(parseEnhancedVocabJson(txt),chunkText);}
  catch(error){error.code='AI_UNAVAILABLE';throw error;}
}
const vocabImportRunner=ImportFlow.createRunner(requestVocabEnhancementSingleChunk);
async function requestVocabEnhancement(rawText,defaultTopic,onProgress){
  const result=await vocabImportRunner.run(rawText,defaultTopic,onProgress);
  const items=finalizeEnhancedItems(result.items,defaultTopic);

  return {items,failed:result.failed};
}

async function doEditWord(oldEn){
  const en=$('#mEn').value.trim();const mean=$('#mMean').value.trim();
  if(!en||!mean){toast('English and Meaning required');return}
  const original = findWordInOriginalDays(oldEn);
  if(!original) { toast('Word not found'); return; }
  const { day, idx, word: prev } = original;
  day.words[idx]={...prev,en,vi:$('#mVi').value.trim(),meaning:mean,topic:$('#mTopicWord')?.value?.trim()||dayTopic(day),example:$('#mEx').value.trim(),situation:$('#mSit').value.trim(),updatedAt:new Date().toISOString()};
  if(norm(oldEn)!==norm(en)){
    if(stats.mastered[oldEn]){stats.mastered[en]=true;delete stats.mastered[oldEn]}
    const oldReviewKey=norm(oldEn),newReviewKey=norm(en);
    if(stats.review?.[oldReviewKey]){
      stats.review[newReviewKey]=stats.review[newReviewKey]||stats.review[oldReviewKey];
      delete stats.review[oldReviewKey];
    }
    mistakePatterns.forEach(item=>{if(norm(item.targetWord)===norm(oldEn))item.targetWord=en});
    practiceLogs.forEach(log=>{if(norm(log.word)===norm(oldEn))log.word=en});
  }
  await save();closeModal();renderDay();toast('Updated');
}
async function removeWord(i){
  if(!confirm('Remove this word?'))return;
  const d=getDay(currentDayId);if(!d)return;
  const w=d.words[i];if(!w)return;
  
  delete stats.mastered[w.en];
  
  const original = findWordInOriginalDays(w.en);
  if(original) {
    const { day, idx } = original;
    
    const mistakesToDelete = mistakePatterns.filter(m => norm(m.targetWord) === norm(w.en) && m.dayId === day.id);
    for (const m of mistakesToDelete) {
      const signature = m.signature || m.id;
      const midx = mistakePatterns.findIndex(p => p.signature === signature);
      if(midx>=0) mistakePatterns.splice(midx,1);
      if (dataService.mode === 'cloud' && dataService.mistakePatternsRef) {
        await dataService.mistakePatternsRef.doc(signature).delete().catch(err => console.warn(err));
      }
    }
    
    const logsToDelete = practiceLogs.filter(l => norm(l.word) === norm(w.en) && l.dayId === day.id);
    for (const l of logsToDelete) {
      const lidx = practiceLogs.findIndex(pl => pl.id === l.id);
      if(lidx>=0) practiceLogs.splice(lidx,1);
      if (dataService.mode === 'cloud' && dataService.practiceLogsRef) {
        await dataService.practiceLogsRef.doc(l.id).delete().catch(err => console.warn(err));
      }
    }
    
    day.words.splice(idx,1);
  }
  
  await save();
  renderDay();
  toast('Removed');
}

rstand what the difference is between X and Y..." for this case. Hard rule: if the student says something like "I even can't use the idiom above in real conversation, I bad huh", correct it as natural self-talk, e.g. "I still can't use that idiom naturally in real conversations. I'm pretty bad at this, huh?" Do not use the unnatural phrase "I'm bad, huh?" unless the context is literally about moral behavior. Fix pronoun reference carefully: use "it" for one term, "them" for two terms, and "these terms/each term" when the user asks how to use vocabulary expressions.
